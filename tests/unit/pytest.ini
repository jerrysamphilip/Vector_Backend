# Unit layer: pure logic, no database, no network, no docker (see docs/TESTING.md).
#
# This file makes tests/unit its own pytest root, so `python -m pytest tests/unit` never loads
# tests/conftest.py (which migrates and connects to MySQL). A full `python -m pytest` from the repo
# root still collects these tests together with the functional ones (root pytest.ini wins there).
[pytest]
addopts = -ra -p no:cacheprovider
markers =
    unit: pure-logic test (tests/unit): no DB, no network, no docker
    functional: in-process API test against a real MySQL (tests/*.py)
filterwarnings =
    ignore::DeprecationWarning
