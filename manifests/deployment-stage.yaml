
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: sales360-stage
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend-container
          image: <ECR_IMAGE_URI>
          ports:
            - containerPort: 8001
            
          env:
            # - name: NODE_ENV
            #   value: "devlopment"
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: sales360-secret
                  key: MYSQL_HOST
          
            - name: MYSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: sales360-secret
                  key: MYSQL_PORT


            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: sales360-secret
                  key: MYSQL_USER

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sales360-secret
                  key: MYSQL_PASSWORD


            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: sales360-secret
                  key: MYSQL_DATABASE
          
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sales360-secret
                  key: OPENAI_API_KEY

            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: sales360-secret
                  key: AWS_ACCESS_KEY_ID

            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: sales360-secret
                  key: AWS_SECRET_ACCESS_KEY


            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: sales360-secret
                  key: AWS_REGION

            - name: AWS_SES_CONFIGURATION_SET
              valueFrom:
                secretKeyRef:
                  name: sales360-secret
                  key: AWS_SES_CONFIGURATION_SET

            - name: AWS_SNS_TOPIC_ARN
              valueFrom:
                secretKeyRef:
                  name: sales360-secret
                  key: AWS_SNS_TOPIC_ARN


            - name: SENDER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: sales360-secret
                  key: SENDER_EMAIL

            
            - name: AWS_SNS_ENABLED
              valueFrom:
                secretKeyRef:
                  name: sales360-secret
                  key: AWS_SNS_ENABLED

            # Security (BR-DF-09). These keys must exist in sales360-secret before deploying:
            # the API refuses to start without the first two. Generate each with
            #   python -c "import secrets; print(secrets.token_urlsafe(48))"
            # Keep CREDENTIALS_ENCRYPTION_KEY stable: changing it makes saved mailbox passwords
            # unreadable. Add ?token=<SES_WEBHOOK_TOKEN> to the SNS subscription URL.
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sales360-secret
                  key: JWT_SECRET_KEY

            - name: CREDENTIALS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: sales360-secret
                  key: CREDENTIALS_ENCRYPTION_KEY

            - name: SES_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sales360-secret
                  key: SES_WEBHOOK_TOKEN

            # Microsoft 365 mailboxes (BR-DF-05), from the Azure app registration. Optional:
            # without them the "Connect Microsoft 365" button explains what is missing.
            # MS365_REDIRECT_URI = https://<host>/vector/api/inboxes/oauth/microsoft/callback
            - name: MS365_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: sales360-secret
                  key: MS365_CLIENT_ID
                  optional: true
            - name: MS365_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sales360-secret
                  key: MS365_CLIENT_SECRET
                  optional: true
            - name: MS365_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: sales360-secret
                  key: MS365_REDIRECT_URI
                  optional: true
            # Calendar & email sync (BR-SF-16), optional
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: sales360-secret
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sales360-secret
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
            - name: GOOGLE_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: sales360-secret
                  key: GOOGLE_REDIRECT_URI
                  optional: true
            - name: GRAPH_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: sales360-secret
                  key: GRAPH_REDIRECT_URI
                  optional: true
            

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: sales360-stage
  labels:
    app: backend
spec:
  type: ClusterIP       
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8001