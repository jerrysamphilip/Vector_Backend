name: CI

# Test layers (docs/TESTING.md):
#   unit        every push / PR, no database          -> job "unit"
#   functional  every push / PR, MySQL service         -> job "test" (also lint + audit)
#   system/e2e/ui need the whole docker stack; they run only on demand (Actions -> CI -> Run workflow)
#               in job "live-stack". They are never part of the PR gate or of CICD.yaml's deploy gate.
on:
  pull_request:
  push:
    branches: [main, dev, stage]
  workflow_call:  # reused by CICD.yaml so a deploy only happens after these gates pass
  workflow_dispatch:
    inputs:
      layer:
        description: "Live-stack layer to run (system, e2e, ui or all). Unit + functional always run too."
        type: choice
        options: [system, e2e, ui, all]
        default: system
      suite:
        description: "Optional suite id(s), comma separated (see python3 scripts/test.py list)"
        required: false
        default: ""
      frontend_ref:
        description: "Vector_Frontend branch/tag to build the web app from"
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit tests (no database)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: test
      AWS_EC2_METADATA_DISABLED: "true"
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (bug-class rules only, see ruff.toml)
        run: ruff check .

      - name: Mypy (app/core, app/services, app/utils; see mypy.ini)
        run: mypy

      # ── NTS Build Standard Addendum gates (docs/CI_GATES.md). All blocking; baselines in ci/ only shrink. ──
      - name: "C-2 type: ignore ratchet (ci/type_ignore_baseline.txt)"
        run: python scripts/ci/check_type_ignores.py

      - name: C-3 no assert in app code (bandit B101; ruff S101 runs above)
        run: bandit -q -r app -t B101

      - name: C-1 complexity (radon; ci/complexity_baseline.json)
        run: python scripts/ci/check_complexity.py

      - name: C-4/C-5 import contracts (.importlinter)
        run: lint-imports

      - name: C-5 function-local imports (ci/local_imports_baseline.txt)
        run: python scripts/ci/check_local_imports.py

      - name: Traceability (docs/REQUIREMENTS.md -> test cases, static)
        run: python scripts/test.py trace --check

      - name: Release identity (VERSION == CHANGELOG.md == manifests == docs)
        run: python scripts/ci/check_version.py

      - name: Unit layer
        run: python scripts/test.py run unit --where host --report-dir reports/ci-unit

      - name: Upload unit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-report
          path: reports/ci-unit
          if-no-files-found: ignore

  contract:
    # Route consistency: every API call in the React app (Vector_Frontend/src) has a backend route with the
    # same method (system_tests/contract/check_contract.py), checked against the OpenAPI schema generated
    # from this commit (no database or server needed). Frontend checkout: secret FRONTEND_REPO_TOKEN (a
    # fine-grained token with contents:read) when set, else the workflow token, which can read the repository
    # only while it is public. If neither can read it the job passes with a visible warning annotation.
    name: Route contract (frontend calls vs backend routes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: test
      RUN_BACKGROUND_JOBS: "false"
      AWS_EC2_METADATA_DISABLED: "true"
      OPENAI_API_KEY: ""
      FRONTEND_REPO: ${{ github.repository_owner }}/Vector_Frontend
      FRONTEND_REF: ${{ inputs.frontend_ref || 'main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Can this run read the frontend repository?
        id: access
        env:
          TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN || github.token }}
        run: |
          if git ls-remote --exit-code "https://x-access-token:${TOKEN}@github.com/${FRONTEND_REPO}.git" "$FRONTEND_REF" >/dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Route contract skipped::Cannot read ${FRONTEND_REPO}@${FRONTEND_REF}. Add the FRONTEND_REPO_TOKEN secret (contents:read) to enforce the frontend/backend route contract."
          fi

      - uses: actions/checkout@v4
        if: steps.access.outputs.ok == 'true'
        with:
          repository: ${{ env.FRONTEND_REPO }}
          ref: ${{ env.FRONTEND_REF }}
          token: ${{ secrets.FRONTEND_REPO_TOKEN || github.token }}
          path: frontend-src

      - uses: actions/setup-python@v5
        if: steps.access.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: OpenAPI schema of this commit
        if: steps.access.outputs.ok == 'true'
        run: |
          pip install -r requirements.txt
          python -c "import json; from app.main import app; json.dump(app.openapi(), open('openapi.json', 'w'))"

      - name: Contract check
        if: steps.access.outputs.ok == 'true'
        run: python system_tests/contract/check_contract.py --frontend frontend-src/src --openapi openapi.json --json contract.json

      - name: Upload contract report
        if: always() && steps.access.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: route-contract
          path: contract.json
          if-no-files-found: ignore

  test:
    name: Lint, audit and functional tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vtest
          MYSQL_USER: vector
          MYSQL_PASSWORD: vector
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: vector
      MYSQL_PASSWORD: vector
      MYSQL_DATABASE: vtest
      ENVIRONMENT: test
      ALLOW_SELF_SIGNUP: "true"
      RUN_BACKGROUND_JOBS: "false"
      JWT_SECRET_KEY: ci-only-jwt-secret-0123456789abcdef0123456789
      CREDENTIALS_ENCRYPTION_KEY: ci-only-credentials-key
      AWS_EC2_METADATA_DISABLED: "true"
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (bug-class rules only, see ruff.toml)
        run: ruff check .

      # Blocking; reviewed, dated exceptions in ci/pip_audit_ignore.txt (docs/CI_GATES.md)
      - name: Dependency audit (pip-audit, blocking)
        run: python scripts/ci/run_pip_audit.py -r requirements.txt

      - name: Migrate database
        run: |
          if [ -f app/db/migrate.py ]; then
            python -m app.db.migrate
          else
            echo "app/db/migrate.py not present; schema is created when the app is imported"
          fi

      # Functional layer (tests/*.py); the unit layer runs in its own job. The MySQL service is the
      # throwaway database, so the runner's own database reset is not used here.
      - name: Functional tests
        run: python -m pytest tests --ignore=tests/unit -q --junitxml=reports/ci-functional/junit-functional.xml

      - name: Upload functional report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-report
          path: reports/ci-functional
          if-no-files-found: ignore

  live-stack:
    # On demand only: the full docker stack on the runner, then system / e2e / UI suites via scripts/test.py.
    # Needs: read access to the Vector_Frontend repository (secret FRONTEND_REPO_TOKEN, a fine-grained token with
    # contents:read), Docker Compose v2.24+ (for `!reset` in the e2e compose file) and about 1-2 h for "all".
    # The suites create their own workspaces; nothing outside the runner is touched. OPENAI_API_KEY stays empty.
    name: Live-stack suites (${{ inputs.layer }})
    if: github.event_name == 'workflow_dispatch'
    needs: [unit, test]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      FRONTEND_DIR: ../Vector_Frontend
      OPENAI_API_KEY: ""
      TEST_CERTS_DIR: ${{ github.workspace }}/.ci-certs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Vector_Frontend
          ref: ${{ inputs.frontend_ref }}
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}
          path: frontend

      - name: Place the frontend next to the backend (FRONTEND_DIR=../Vector_Frontend)
        run: mv frontend ../Vector_Frontend

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Playwright + Chromium for the UI suites
        working-directory: system_tests
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          CHROMIUM=$(node -e "console.log(require('playwright').chromium.executablePath())")
          sudo mkdir -p /opt/pw-browsers && sudo ln -sf "$CHROMIUM" /opt/pw-browsers/chromium

      - name: Start the stack (mysql, migrate, api, worker, web)
        run: |
          docker compose up -d --build
          python3 scripts/test.py env status

      - name: E2E wiring (SES stand-in, SEND_ON_ANY_DAY)
        if: inputs.layer == 'e2e' || inputs.layer == 'all'
        run: |
          mkdir -p "$TEST_CERTS_DIR" && cp /etc/ssl/certs/ca-certificates.crt "$TEST_CERTS_DIR/ca.crt"
          python3 scripts/test.py env up --e2e --build --execute

      - name: Prerequisites
        run: python3 scripts/test.py doctor || true

      - name: Run ${{ inputs.layer }}
        run: |
          SUITE_ARGS=""
          if [ -n "${{ inputs.suite }}" ]; then SUITE_ARGS="--suite ${{ inputs.suite }}"; fi
          python3 scripts/test.py run ${{ inputs.layer }} --keep-going --restart-api-between \
            --report-dir reports/ci-live $SUITE_ARGS

      - name: Upload live-stack report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-stack-report
          path: reports/ci-live
          if-no-files-found: ignore

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 300 api worker

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans the commit range of the push / pull request
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Organisation-owned repositories also need GITLEAKS_LICENSE (free key from gitleaks.io)
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
