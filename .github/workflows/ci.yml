name: CI

on:
  pull_request:
  push:
    branches: [main, dev, stage]
  workflow_call:  # reused by CICD.yaml so a deploy only happens after these gates pass

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, audit and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vtest
          MYSQL_USER: vector
          MYSQL_PASSWORD: vector
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: vector
      MYSQL_PASSWORD: vector
      MYSQL_DATABASE: vtest
      ENVIRONMENT: test
      ALLOW_SELF_SIGNUP: "true"
      RUN_BACKGROUND_JOBS: "false"
      JWT_SECRET_KEY: ci-only-jwt-secret-0123456789abcdef0123456789
      CREDENTIALS_ENCRYPTION_KEY: ci-only-credentials-key
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (bug-class rules only, see ruff.toml)
        run: ruff check .

      - name: Dependency audit (advisory)
        continue-on-error: true
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Migrate database
        run: |
          if [ -f app/db/migrate.py ]; then
            python -m app.db.migrate
          else
            echo "app/db/migrate.py not present; schema is created when the app is imported"
          fi

      - name: Tests
        run: python -m pytest -q

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans the commit range of the push / pull request
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Organisation-owned repositories also need GITLEAKS_LICENSE (free key from gitleaks.io)
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
