name: Deploy to ECR and EKS (Dev / Stage)

on:
  push:
    branches:
      - dev
      - stage

env:
  EKS_CLUSTER_NAME: nts-innovation-ai
  AWS_REGION: us-west-2
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:
  # Same gates as pull requests (lint, tests, secret scan): nothing deploys unless they pass
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build-and-deploy:
    name: Build, Push Docker Image, and Deploy to EKS
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # P-2: every FROM / image line must be pinned by digest (refresh with scripts/pin_images.py
      # before a release, see docs/RELEASE.md). No network needed.
      - name: Check image digest pins
        run: python3 scripts/pin_images.py --check

      - name: Set environment based on branch
        run: |
          BRANCH=${GITHUB_REF##*/}

          if [ "$BRANCH" = "dev" ]; then
            echo "ENV=dev" >> $GITHUB_ENV
            echo "NAMESPACE=sales360" >> $GITHUB_ENV
            echo "MANIFEST=manifests/deployment.yaml" >> $GITHUB_ENV

          elif [ "$BRANCH" = "stage" ]; then
            echo "ENV=stage" >> $GITHUB_ENV
            echo "NAMESPACE=sales360-stage" >> $GITHUB_ENV
            echo "MANIFEST=manifests/deployment-stage.yaml" >> $GITHUB_ENV
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set short git commit SHA
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REPOSITORY:$IMAGE_TAG \
            .

      - name: Push Docker image to ECR
        run: |
          docker push $ECR_REPOSITORY:$IMAGE_TAG
          # Deploy the pushed image by digest, never by its (mutable) tag (P-2)
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' $ECR_REPOSITORY:$IMAGE_TAG | cut -d@ -f2)
          case "$DIGEST" in sha256:*) ;; *) echo "No digest for pushed image" >&2; exit 1;; esac
          echo "IMAGE_REF=$ECR_REPOSITORY:$IMAGE_TAG@$DIGEST" >> $GITHUB_ENV

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name $EKS_CLUSTER_NAME \
            --region $AWS_REGION

      - name: Update image in manifest
        run: |
          sed -i "s|<ECR_IMAGE_URI>|$IMAGE_REF|g" $MANIFEST
          # The rendered manifest may not keep any placeholder or tag-only image
          python3 scripts/pin_images.py --check --strict $MANIFEST

      # P-3 compensating control (docs/adr/0008-internal-transport.md). Opt-in per repository
      # variable until the ingress source in manifests/networkpolicy.yaml is confirmed for the
      # cluster: a wrong source there blocks all traffic to the app.
      - name: Apply NetworkPolicies
        if: vars.APPLY_NETWORK_POLICIES == 'true'
        run: |
          kubectl apply -n $NAMESPACE -f manifests/networkpolicy.yaml

      - name: Deploy to EKS
        run: |
          kubectl apply -n $NAMESPACE -f $MANIFEST

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/backend -n $NAMESPACE --timeout=600s
          kubectl rollout status deployment/backend-worker -n $NAMESPACE --timeout=600s

      - name: Success
        run: |
          echo "✅ Deployment successful"
          echo "Environment: $ENV"
          echo "Namespace: $NAMESPACE"
          echo "Manifest: $MANIFEST"
          echo "Image: $IMAGE_REF"
