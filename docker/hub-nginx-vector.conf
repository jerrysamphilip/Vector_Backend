    # ── Vector — Outreach360 ─────────────────────────────
    # Paste into the shared hub nginx `server { ... }` block (next to PatientTrack).
    # Runs as its own compose project (vector, see docker-compose.yml). Its web container is published on
    # host port 8190 and reached through host.docker.internal. The app is built with BASE_PATH=/vector/,
    # so the prefix is kept on both sides. Its API is called as /vector/api/ and its assets as
    # /vector/assets/, so it does not clash with WSR's /api/ or TeamMap's /assets/.
    location = /vector {
        return 301 /vector/;
    }

    location /vector/ {
        proxy_pass         http://host.docker.internal:8190/vector/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50M;
    }
