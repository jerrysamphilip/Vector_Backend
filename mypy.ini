# Static type checking (CI: .github/workflows/ci.yml, unit job). Run locally:
#   pip install -r requirements-dev.txt && mypy
#
# Baseline (2026-10): every module in app/core, app/services and app/utils is checked with
# check_untyped_defs, and app/core plus the domain-error module must be fully annotated.
# Raise the bar module by module: add a [mypy-app.services.<name>] section with
# disallow_untyped_defs = True once a service is fully annotated.
[mypy]
python_version = 3.12
files = app/core, app/services, app/utils, app/domain, app/repositories, app/adapters
# app/ has no __init__.py: map paths to modules from the repo root
explicit_package_bases = True
mypy_path = .
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unused_configs = True
strict_equality = True
show_error_codes = True
# Third-party packages without type information
ignore_missing_imports = True
# Modules outside the configured files (app/routers, app/prompts, app/db, ...) are analysed for types
# but their own errors are not reported
follow_imports = silent

# The ORM models still use classic `Column(...)` declarations, which type checkers read as
# Column[...] rather than the Python value (every `obj.name = "x"` would be an error). Until the
# models move to SQLAlchemy 2 `Mapped[...]` annotations they are treated as Any by importers.
[mypy-app.models.*]
follow_imports = skip

# Fully annotated: no new untyped functions here
[mypy-app.core.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

# Target layers (ADR 0009): fully annotated from the start
[mypy-app.domain.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-app.repositories.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-app.adapters.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
